<!DOCTYPE html>
<html lang="ko">
<head>
 <header basic-components="components/header.html">
</header>

<body>

<section id="location" style="flex:1;">
  <div class="wrap">
    <div class="loc-grid">
      <div>
        <p class="sec-tag sr">Information</p>
        <h2 class="sec-h sr" id="e-info-h">오시는 <em>방법</em></h2>
        <p class="loc-body sr" id="e-info-detail">
          편안한 마음으로 문의해 주세요. 가까운 지점으로 안내해 드립니다.
        </p>

        <ul class="loc-list">
          <li class="loc-item sr">
            <div class="loc-ico">📍</div>
            <div class="loc-meta">
              <span class="loc-lbl">상담 장소</span>
              <span class="loc-val" id="e-loc">수원 및 용인 센터 운영<br>(문의 후 가까운 지점으로 배정해 드립니다)</span>
            </div>
          </li>
          <li class="loc-item sr d3">
            <div class="loc-ico">📠</div>
            <div class="loc-meta">
              <span class="loc-lbl">FAX 문의</span>
              <span class="loc-val" id="Fax">0504-034-6940</span>
            </div>
          </li>
        </ul>
      </div>

      <div class="map-box sr">
        <a href="https://map.naver.com/" target="_blank" id="e-map-link">
          <img src="assets/location.jpg" alt="지도 보기" id="img-map" style="width:100%; height:100%; object-fit:cover;">
          <div class="map-overlay">클릭하시면 지도로 연결됩니다</div>
        </a>
      </div>
    </div>
  </div>
</section>

 <div basic-components="components/footer.html"></div>

<div id="toast"></div>
<script type="module" src="main.js" defer></script>
<script  src="components/components.js" defer></script>

</body>
</html>
