<script>
	
	$('.radio-custom').click(function(){
		if($(this).prop("checked", true)){
			$(this).parents('tr').addClass("on");
		}
	});

	$('.result_btn').click(function() {
        var num = '20';
        var my_score = 0;
        var my_res = '';
        var st_res_1 = $('#st_res_1').val();
        var st_res_2 = $('#st_res_2').val();
        var st_res_3 = $('#st_res_3').val();
        var st_res_4 = $('#st_res_4').val();

        var st_res_4_txt = $('#st_res_4_txt').val();
        var st_res_5_txt = $('#st_res_5_txt').val();

        for (var i=1; i<=num; i++) {
            if (!$('input[name="st_radio_'+i+'"]').is(':checked')) {
                alert(i+'번 문항을 선택해주세요.');
                return;
            } else {
                my_score += Number($('input[name="st_radio_'+i+'"]:checked').val());
            }
        }



        my_res = st_res_1_txt;
        if (st_res_2 != '' && my_score >= st_res_2) {
            my_res = st_res_2_txt;
        }
        if (st_res_3 != '' && my_score >= st_res_3) {
            my_res = st_res_3_txt;
        }
        if (st_res_4 != '' && my_score >= st_res_4) {
