<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HTML to PDF Export</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #content-to-export { padding: 20px; border: 1px solid #ccc; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div id="content-to-export">
        <h2>판매 보고서 샘플</h2>
        <table>
            <thead>
                <tr>
                    <th>품목</th>
                    <th>수량</th>
                    <th>가격</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>노트북</td>
                    <td>5</td>
                    <td>$5,000</td>
                </tr>
                <tr>
                    <td>모니터</td>
                    <td>10</td>
                    <td>$3,000</td>
                </tr>
            </tbody>
        </table>
    </div>

    <button onclick="exportPDF()">PDF로 다운로드</button>

    <script>
        /**
         * HTML 콘텐츠를 PDF로 내보내는 함수
         */
        function exportPDF() {
            // PDF로 만들 요소 선택
            const element = document.getElementById('content-to-export');

            // 2. PDF 변환 옵션 설정
            const options = {
                margin:       10,               // 여백 (mm)
                filename:     'report.pdf',    // 파일명
                image:        { type: 'jpeg', quality: 0.98 }, // 이미지 품질
                html2canvas:  { scale: 2 },     // 해상도 조절 (숫자가 높을수록 고화질)
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' } // 용지 설정
            };

            // 3. 라이브러리 실행 및 다운로드
            // html2pdf().from(요소).set(옵션).save();
            html2pdf().set(options).from(element).save();
        }
    </script>

</body>
</html>
