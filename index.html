<!DOCTYPE html>
<html lang="ko">
<head>
 <header basic-components="components/header.html">
</header>

<body>
  
<div id="admin-bar">
  <span class="ab-badge">관리자 모드</span>
  <div class="ab-actions">
    <button class="ab-btn save" onclick="saveAll()">💾 저장</button>
    <button class="ab-btn" onclick="logout()">로그아웃</button>
  </div>
</div>

<section id="therapist" style="flex:1;">
  <div class="therapist-content">
    <p class="therapist-eyebrow">Mind & Cognitive Behavioral Therapy</p>
    <h1 class="therapist-h1" id="e-hero-h">
      당신의 마음이<br><em>다시 숨 쉴 수 있게</em><br>함께 걷겠습니다.
    </h1>
    <p class="therapist-body" id="e-hero-b-intro">
      마음, 인지행동심리상담센터는 근거 기반의 인지행동치료(CBT)를 통해 개인의 심리적 회복과 성장을 돕는 전문 기관입니다. 
      정신과 병원과의 협업을 통해 의학적 소견과 심리학적 개입의 균형을 유지하고 있습니다.
    </p>
  </div>

  <div class="therapist-photo drop-zone" id="drop-hero" data-key="img-hero">
    <img id="img-hero" src="assets/logo.png" alt="센터소개">
  </div>
</section>

 <div basic-components="components/footer.html"></div>

<div id="toast"></div>
<script type="module" src="main.js" defer></script>
<script  src="components/components.js" defer></script>
</body>
</html>
