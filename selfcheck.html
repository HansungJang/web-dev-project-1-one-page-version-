<!-- 설문지 본문 -->
 <div class="survey-selector-wrapper">
    <div class="selector-label">자가진단 유형을 선택해주세요</div>
    <select id="type-select">
        <option value="">설문지를 선택하세요</option>
        <option value="adult">성인 자가진단</option>
        <option value="student">청소년 자가진단</option>

 </div>

<div id="survey-app" class="survey-container" class="display-none">

        <div class="progress-info">
            <span id="cat-title">준비 중...</span>

    <main id="chat-window" class="chat-window">
        </main>

    <footer id="input-control" class="input-area">
        <input type="text" id="answer-input" placeholder="답변을 입력하세요..." autofocus>
        <button id="send-btn">전송</button>
    </footer>

    <section id="final-step" class="final-step hidden">
        <p class="finish-msg"><strong>모든 질의응답이 종료되었습니다.</strong></p>
        <div class="button-group">
            <button onclick="exportPDF()" class="btn-pdf">1. 답변 PDF 출력하기</button>
            <button onclick="applyConsult('interpretation')" class="btn-info">2. 해석 상담 신청</button>
            <button onclick="applyConsult('personal')" class="btn-primary">3. 개인 상담 신청</button>
        </div>
    </section>
</div>

<!-- 사전 동의서 -->
<div id="consent-modal" class="modal-overlay">
  <div class="modal-content">
    <h2>서비스 이용 사전 동의</h2>
    <div class="consent-form">
      <label>
        <input type="checkbox" id="chk-privacy" required>
        (필수) 개인정보 수집 및 민감정보(심리 진단 내역) 처리에 동의합니다.
      </label>
      
      <label>
        <input type="checkbox" id="chk-automated" required>
        (필수) 알고리즘을 통한 자동화된 결정 방식에 대한 안내를 확인하였으며, 이에 동의합니다.
      </label>

      <label>
        <input type="checkbox" id="chk-overseas" required>
        (필수) 결과 리포트 전송을 위한 개인정보의 국외 이전 및 구글 위탁 처리에 동의합니다.
      </label>

      <label>
        <input type="checkbox" id="chk-copyright" required>
        (필수) 저작권 보호 및 개인적 용도 한정 이용 조항에 동의합니다.
      </label>

    </div>
    <button onclick="startDiagnosis()" id="btn-start">진단 시작하기</button>
  </div>
</div>
  

<footer>
  <div class "foot-row">

<script type="module" src="main.js" defer></script>
<script>
    const contents = document.getElementById('survey-app');
    const modal = document.getElementById('consent-modal');
    const agreeBtn = document.getElementById('btn-start');
    const body = document.body;
    
    const essentialChecks = ['chk-privacy', 'chk-automated', 'chk-overseas', 'chk-copyright'];
    const typeSelect = document.getElementById('type-select');
    
    body.classList.add("dark-bg"); 

    const essentialCheckcontents = ["(필수) 개인정보 수집 및 민감정보(심리 진단 내역) 처리에 동의합니다.", "(필수) 알고리즘을 통한 자동화된 결정 방식에 대한 안내를 확인하였으며, 이에 동의합니다.", "(필수) 결과 리포트 전송을 위한 개인정보의 국외 이전 및 구글 위탁 처리에 동의합니다.", "(필수) 저작권 보호 및 개인적 용도 한정 이용 조항에 동의합니다."];


    // 2026년 보안 지침에 따른 sessionStorage 데이터 암호화 예시 
// function saveEncryptedData(key, value) {
//     // 실제 구현 시 CryptoJS 등 라이브러리 사용 권장
//     const encrypted = btoa(unescape(encodeURIComponent(value))); 
//     sessionStorage.setItem(key, encrypted);
// }

// 자동화된 결정에 대한 설명 요구권 및 거부권 처리 (Human-in-the-loop) [cite: 48]
function requestHumanReview() {
    alert("전문 상담사의 재검토 절차가 접수되었습니다. 24시간 이내에 연락드리겠습니다.");
}

function checkAllAgreements() {
    for (const id of essentialChecks) {
            sessionStorage.setItem(id, 'true'); // 동의 여부 저장
        }
 }

function startDiagnosis() {
    const allChecked = essentialChecks.every(id => document.getElementById(id).checked);
    if (allChecked) {
        checkAllAgreements(); // 동의 여부 저장
        closeModal(); // 모달 닫기
        console.log("진단 프로세스 시작");

    } else {
        alert("필수 동의 항목에 모두 체크해주세요.");
    }
}

    function closeModal() {
        contents.classList.remove("display-none");
        modal.classList.add("display-none");
        body.classList.remove("dark-bg");
    }

    // 페이지 로드 시 기존 동의 여부 확인
    window.onload = () => {
        const isAgreed = localStorage.getItem('user_agreed');
        if (isAgreed === 'true') {
            closeModal(); // 이미 동의했다면 모달 없이 바로 콘텐츠 표시
        }
    };

    //
    const surveyConfigs = {
    adult: [
        { title: "문제 및 주 증상", questions: ["현재 가장 불편한 증상은 무엇인가요?"] },
        { title: "의학적/치료 병력", questions: ["의학적 병력에 대해 기술해주세요."] },
        { title: "개인 습관/경험", questions: ["성장 과정의 주요 사건은?"] },
        { title: "사회생활", questions: ["대인관계나 직장생활은?"] },
        { title: "가족관계", questions: ["가족 구성원과의 관계는?"] },
        { title: "약물/범죄 이력", questions: ["약물 복용 이력"] },
        { title: "애인/결혼 생활", questions: ["결혼 생활 혹은 파트너 관계는?"] }
    ],
    student: [
        { title: "개인 습관/경험", questions: ["성장 과정의 주요 사건은?" ] }
        // { title: "학교생활", questions: ["학교 내 대인관계나 생활은?", "성장 과정의 주요 사건은?"] },
        // { title: "가족관계", questions: ["가족 구성원과의 관계는?", "성장 과정의 주요 사건은?"] }
    ]
};

    let surveyData = []; // 현재 선택된 설문 데이터

    let state = {
        catIdx: 0,
        queIdx: 0,
        doneCount: 0,
        totalCount: 0 
    };

    // 설문 데이터 정의
typeSelect.addEventListener('change', (e) => {
    const selectedType = e.target.value;
    
    // 3. 조건부 상태 활용 (Optional Chaining 및 기본값 설정)
    surveyData = surveyConfigs[selectedType] || [];

    console.log("선택된 설문 데이터:", surveyData);
    if(surveyData.length > 0) {
        state.catIdx = 0;
        state.queIdx = 0;
        state.doneCount = 0;
        state.totalCount = surveyData.reduce((sum, cat) => sum + cat.questions.length, 0);
        addMessage(`"${typeSelect.options[typeSelect.selectedIndex].text}" 설문이 선택되었습니다. 진단을 시작합니다.`, 'bot');
    }
    // 이후 surveyData를 활용해 UI를 렌더링하는 함수를 호출하면 됩니다.
    renderQuestion();
});



    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
        renderQuestion();
        document.getElementById('send-btn').addEventListener('click', handleAnswer);
        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAnswer();
        });
    });

    // 질문 렌더링
    function renderQuestion() {
        if(surveyData.length === 0) {
            addMessage("설문지를 선택해주세요.", 'bot');
            return;
        }
        
        const qText = surveyData[state.catIdx].questions[state.queIdx];
        addMessage(`[${surveyData[state.catIdx].title}] ${qText}`, 'bot');
        updateUI();
    }

    // 메시지 추가
    function addMessage(text, type) {
        const chatWin = document.getElementById('chat-window');
        const msg = document.createElement('div');
        msg.className = `bubble ${type}`;
        msg.innerText = text;
        chatWin.appendChild(msg);
        chatWin.scrollTop = chatWin.scrollHeight;
    }

    // 답변 제출 로직
    function handleAnswer() {
        const input = document.getElementById('answer-input');
        const val = input.value.trim();
        if (!val) return;

        addMessage(val, 'user');
        saveToStorage(val);
        input.value = "";

        // 이어쓰기 확인 로직
        setTimeout(() => {
            if (confirm("다음 문항으로 넘어가시겠습니까?\n(취소 시 현재 문항 보충 작성)")) {
                moveNext();
            } else {
                addMessage("현재 문항에 내용을 이어서 입력해주세요.", 'bot');
            }
        }, 100);
    }

    // 데이터 저장 (SessionStorage)
    function saveToStorage(answer) {
        const key = `survey_ans_${state.catIdx}_${state.queIdx}`;
        const prev = sessionStorage.getItem(key) || "";
        sessionStorage.setItem(key, prev ? `${prev} ${answer}` : answer);
    }

    // 다음 단계 이동
    function moveNext() {
        state.doneCount++;
        state.queIdx++;

        if (state.queIdx >= surveyData[state.catIdx].questions.length) {
            state.catIdx++;
            state.queIdx = 0;
        }

        if (state.catIdx >= surveyData.length) {
            console.log('donecount:', state.doneCount, 'totalcount:', state.totalCount); 
            updateUI();
            completeSurvey();
        } else {
            renderQuestion();
        }
    }

    // UI 업데이트 (진행도)
    function updateUI() {
        const percent = Math.floor((state.doneCount / state.totalCount) * 100);
        document.getElementById('progress-fill').style.width = `${percent}%`;
        document.getElementById('progress-percent').innerText = `${percent}%`;
        document.getElementById('cat-title').innerText = state.catIdx < surveyData.length ? `Ch.${state.catIdx + 1}. ${surveyData[state.catIdx].title}` :  "설문 완료";
    }

    // 종료 처리
    function completeSurvey() {
        document.getElementById('input-control').classList.add('hidden');
        document.getElementById('final-step').classList.remove('hidden');
        addMessage("설문이 모두 끝났습니다. 고생하셨습니다!", 'bot');
    }

    // 기능 확장용 함수들
    function exportPDF() { 
        // step 1. sessionStorage 순회 (동의서, 설문 항목 | 2가지로 분리 [배열 텍스트 추출])

        let surveyResults = [];
        //let policyAgreements = []; essentialChecks 를 통해서 allAgreement로 인해서 동의를 이미 받은 상태이므로 별도 추출은 생략

        for(let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            if (key.startsWith('survey_ans_')) {
                const data = sessionStorage.getItem(key);

                const match = key.match(/survey_ans_(\d+)_(\d+)/);
                if (match) {
                    const catIdx = parseInt(match[1]);
                    const queIdx = parseInt(match[2]);
                    const qText = surveyData[catIdx]?.questions[queIdx] || "질문 텍스트 없음";
                    //console.log({ catIdx, queIdx, qText, answer: data });
                    surveyResults.push({ catIdx, queIdx, qText, answer: data });
                }
            }
        }
        console.log("추출된 설문 결과:", surveyResults);
        // step 2. 보고서 답변 항목 정렬 (질문 번호 기준)
        surveyResults.sort((a, b) => {
            if (a.catIdx === b.catIdx) {
                return a.queIdx - b.queIdx; // 같은 카테고리 내에서는 질문 번호로 정렬
            }
            return a.catIdx - b.catIdx; // 카테고리 번호로 정렬
        });

        // step 3. HTML 템플릿 생성
        function typeAnnounce() {
            switch(typeSelect.value) {
                case 'adult': return "성인 자가진단";
                case 'student': return "청소년 자가진단";
                default: return "알 수 없는 유형";
            }
        }

        // 사전 동의서 문서  
        let consentContent = `
            <div style="padding: 30px; font-family: 'Noto Sans KR', sans-serif; line-height: 1.6;">
                <div style="border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
                    <h1 style="margin: 0; color: #1a1a1a;">자가진단 사전 동의서</h1>
                    <p style="margin: 5px 0 0 0; color: #666;">마음 , 인지행동심리상담센터</p>
                </div>
                
                <p style="text-align: right; font-size: 0.9em;">발행일시: ${new Date().toLocaleString()}</p>

                <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <tr style="background-color: #f8f9fa;">
                        <th style="border: 1px solid #dee2e6; padding: 12px; width: 30%;">항목</th>
                        <th style="border: 1px solid #dee2e6; padding: 12px; width: 70%;">내용</th>
                    </tr>
        `;
            essentialCheckcontents.forEach( id => {
                     consentContent += `
                        <tr>
                            <td style="border: 1px solid #dee2e6; padding: 12px; font-weight: bold;">${id}</td>
                            <td style="border: 1px solid #dee2e6; padding: 12px;">동의함</td>
                        </tr>
                    `;
             });

        consentContent += `
                </table>
        `;

        // 자가진단 설문 응답 문서  
        let reportContent = `
            <div style="padding: 30px; font-family: 'Noto Sans KR', sans-serif; line-height: 1.6;">
                <div style="border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
                    <h1 style="margin: 0; color: #1a1a1a;">자가진단 결과 보고서</h1>
                    <p style="margin: 5px 0 0 0; color: #666;">마음 , 인지행동심리상담센터</p>
                </div>
                
                <p style="text-align: right; font-size: 0.9em;">발행일시: ${new Date().toLocaleString()}</p>
                <p style="text-align: right; font-size: 0.9em;">자가진단 유형: ${typeAnnounce()}</p>

                <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <tr style="background-color: #f8f9fa;">
                        <th style="border: 1px solid #dee2e6; padding: 12px; width: 20%;">항목</th>
                        <th style="border: 1px solid #dee2e6; padding: 12px; width: 20%;">질문</th>
                        <th style="border: 1px solid #dee2e6; padding: 12px; width: 60%;">내용</th>
                    </tr>
        `;

        surveyResults.forEach(item => {
            reportContent += `
                <tr>
                    <td style="border: 1px solid #dee2e6; padding: 12px; text-align: center; font-weight: bold;">Ch.${item.catIdx + 1}</td>
                    <td style="border: 1px solid #dee2e6; padding: 12px;">${item.qText}</td>
                    <td style="border: 1px solid #dee2e6; padding: 12px;">${item.answer}</td>
                </tr>
            `;
        });

        reportContent += `
                </table>
                
                <div style="margin-top: 40px; padding: 20px; background-color: #f1f3f5; border-radius: 8px;">
                    <p style="margin: 0; font-size: 0.9em; color: #495057;">
                        * 본 진단 결과는 참고용이며, 정확한 진단은 전문가와의 상담을 통해 확인하시기 바랍니다.
                    </p>
                </div>
            </div>
        `;

        // step 4. html2pdf로 PDF 저장 실행
            const worker = html2pdf();
            const opt = {
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                margin: 15,
                filename: `SelfCheck_Report_${new Date().getTime()}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };          

            worker.from(consentContent + reportContent).set(opt).save();
 

        alert("PDF 생성을 준비 중입니다."); }
    function applyConsult(type) { alert(`${type} 상담 신청이 완료되었습니다.`); }
 </script>



</body>
