function requestHumanReview() {
    alert("전문 상담사의 재검토 절차가 접수되었습니다. 24시간 이내에 연락드리겠습니다.");
}

function checkAllAgreements() {
    for (const id of essentialChecks) {
            sessionStorage.setItem(id, 'true'); // 동의 여부 저장
        }
 }

function startDiagnosis() {
    const allChecked = essentialChecks.every(id => document.getElementById(id).checked);
    if (allChecked) {
        checkAllAgreements(); // 동의 여부 저장
        closeModal(); // 모달 닫기
        console.log("진단 프로세스 시작");

    } else {
        alert("필수 동의 항목에 모두 체크해주세요.");
    }
}

    function closeModal() {
        contents.classList.remove("display-none");
        modal.classList.add("display-none");
        body.classList.remove("dark-bg");
    }

    // 페이지 로드 시 기존 동의 여부 확인
    window.onload = () => {
        const isAgreed = localStorage.getItem('user_agreed');
        if (isAgreed === 'true') {
            closeModal(); // 이미 동의했다면 모달 없이 바로 콘텐츠 표시
        }
    };

    // 메시지 화면 출력 함수
    function appendMessage(text, sender) {
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerText = text;
        chatContainer.appendChild(bubble);
        
        // 스크롤을 항상 아래로 유지
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // SessionStorage에 답변 저장 함수
    function saveToSession(key, value) {
        let surveyData = JSON.parse(sessionStorage.getItem('survey_results')) || {};
        surveyData[key] = value;
        sessionStorage.setItem('answer[' + key + ']', JSON.stringify(surveyData)); // 배열 형태로 저장 변경, 다수 답변에 대해서 저장 가능
    }

    // 전송 버튼 클릭 이벤트
    window.answer_number = 1; // 질문 번호 초기화
    sendBtn.addEventListener('click', () => {
        const text  = userInput.value.trim();
        if (text !== "") {
            // 1. 사용자 말풍선 추가
            appendMessage(text, 'user');
            
            // 2. 데이터 저장 (예: 질문 키값을 'subjective_ans'로 지정)
            saveToSession(window.answer_number, text); // 
            window.answer_number += 1; // 다음 질문을 위해 번호 증가
            // 3. 입력창 비우기
            userInput.value = "";
            
            // 4. (선택사항) 봇의 다음 반응 시뮬레이션
            setTimeout(() => {
                appendMessage("답변 감사합니다. 다음 질문으로 넘어갈까요?", 'bot');
            }, 600);
        }
    });

    // 엔터키 지원
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendBtn.click();
    });

    // 초기 질문 실행
    window.onload = () => {
        appendMessage("현재 가장 고민이 되는 부분을 자유롭게 적어주세요.", "bot");
    };
