<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<div id="sub_content">
    <div class="sub_inner">
        <div class="sub_title_txt">
            <div class="sec-tag">Self Check</div>
            <h3 class="sec-h">마음 건강 <em>자가진단</em></h3>
            <p class="sec-sub">현재 나의 마음 상태를 객관적으로 확인해 보세요.</p>
        </div>

        <div class="test_wrap wrap">
            <ul class="test_tabnav" id="target-tabs"></ul>
            
            <ul class="test_category_nav" id="category-tabs"></ul>

            <div class="tp_box">
                <div class="info_header">
                    <span class="badge" id="target-label">대상 로딩중...</span>
                    <h4 id="cat-title">진단 항목을 선택해 주세요</h4>
                </div>
                <p id="cat-description" class="sec-sub">각 문항을 읽고 자신에게 해당되는 정도를 체크해 주시기 바랍니다.</p>
            </div>

            <div class="test_table_wrap">
                <table>
                    <thead>
                        <tr>
                            <th>평가 문항</th>
                            <th>전혀<br>아님</th>
                            <th>가끔<br>그럼</th>
                            <th>자주<br>그럼</th>
                            <th>항상<br>그럼</th>
                        </tr>
                    </thead>
                    <tbody id="survey-tbody">
                        </tbody>
                </table>
            </div>

            <div id="result-area" class="result_box">
                <div class="result_inner">
                    <div class="score_circle">
                        <span class="score_lbl">나의 점수</span>
                        <strong id="my_score">0</strong>
                        <span class="unit">점</span>
                    </div>
                    <p id="my_res"></p>
                    <div class="btn_group">
                        <button type="button" class="result_btn" onclick="exportPDF()">결과 PDF로 저장하기</button>
                        <a href="/apply" class="btn-solid">전문가 상담 예약하기</a>
                        <button type="button" class="reset_btn_text" onclick="resetSurvey()">테스트 다시하기</button>
                    </div>
                </div>
            </div>

            <div class="action_wrap">
                <button type="button" class="result_btn" onclick="calculateResult()">결과 확인하기</button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * 자가진단 데이터 통합 관리
 */

const surveyTarget = {
    "adult" : "성인 (만 19세 이상)",
    "student" : "청소년 (초 ~ 중/고등학생)"
};


const surveyMaster1 = [
    { 
        id: "adult_depress",
        category: "우울증", 
        target: "성인 (만 19세 이상)",
        questions: ["내가 처한 상황이 비참하다.", "이유 없이 피곤하다.", "체중이 변화했다.", "집중력이 예전만 못하다.", "무기력함을 자주 느낀다."],
        results: [
            { min: 0, max: 4, text: "안정적인 상태입니다." },
            { min: 5, max: 9, text: "경증의 우울감이 있습니다. 상담을 권장합니다." },
            { min: 10, max: 20, text: "중증 우울상태입니다. 빠른 내원을 권장합니다." }
        ]
    },
    { 
        id: "adult_adhd",
        category: "성인 ADHD", 
        target: "성인 (만 19세 이상)",
        questions: ["일의 마지막 세부사항을 마무리하기 힘들다.", "체계적인 순서 정하기가 어렵다.", "약속이나 일정을 자주 잊는다."],
        results: [
            { min: 0, max: 4, text: "정상 범위입니다." },
            { min: 5, max: 12, text: "주의 깊은 관찰과 진단이 필요합니다." }
        ]
    },
    { 
        id: "student_stress",
        category: "학업 스트레스", 
        target: "청소년 (중/고등학생)",
        questions: ["공부 때문에 잠을 설친다.", "시험 기간에 극도로 예민하다.", "학교 가는 것이 두렵다."],
        results: [
            { min: 0, max: 12, text: "적절히 관리되고 있습니다." }
        ]
    }
];

const surveyMaster2 = [
    { 
        id: "adult_depress",
        category: "햄버거", 
        target: "성인 (만 19세 이상)",
        questions: ["내가 처한 상황이 비참하다.", "이유 없이 피곤하다.", "체중이 변화했다.", "집중력이 예전만 못하다.", "무기력함을 자주 느낀다."],
        results: [
            { min: 0, max: 4, text: "안정적인 상태입니다." },
            { min: 5, max: 9, text: "경증의 우울감이 있습니다. 상담을 권장합니다." },
            { min: 10, max: 20, text: "중증 우울상태입니다. 빠른 내원을 권장합니다." }
        ]
    },
    { 
        id: "adult_adhd",
        category: "피지", 
        target: "성인 (만 19세 이상)",
        questions: ["일의 마지막 세부사항을 마무리하기 힘들다.", "체계적인 순서 정하기가 어렵다.", "약속이나 일정을 자주 잊는다."],
        results: [
            { min: 0, max: 4, text: "정상 범위입니다." },
            { min: 5, max: 12, text: "주의 깊은 관찰과 진단이 필요합니다." }
        ]
    },
    { 
        id: "student_stress",
        category: "학업 스트레스", 
        target: "청소년 (중/고등학생)",
        questions: ["공부 때문에 잠을 설친다.", "시험 기간에 극도로 예민하다.", "학교 가는 것이 두렵다."],
        results: [
            { min: 0, max: 12, text: "적절히 관리되고 있습니다." }
        ]
    }
];

// 상위 타겟과 데이터 셋을 매핑
const targetDataMap = {
    "adult": surveyMaster1,
    "student": surveyMaster2
};

let currentTargetKey = "adult"; // 현재 선택된 타겟 (기본값)
let currentSurvey = null;



$(document).ready(function() {
renderTargetTabs(); // 1. 상위 타겟 탭 생성
    updateCategoryTabs("adult"); // 2. 초기값인 성인용 카테고리 생성 및 첫 설문 로드});
});

// 탭 메뉴 토글
function renderTargetTabs() {
    const $tabs = $('#target-tabs').empty();
    Object.entries(surveyTarget).forEach(([key, value]) => {
        const isActive = key === currentTargetKey ? 'active' : '';
        $tabs.append(`
            <li class="${isActive}" data-target="${key}" onclick="changeTarget('${key}', this)">
                <a href="javascript:;">${value}</a>
            </li>
        `);
    });
}

// 타겟 변경 시 실행되는 함수
function changeTarget(targetKey, el) {
    currentTargetKey = targetKey;
    
    // 탭 활성화 UI 변경
    $('#target-tabs li').removeClass('active');
    $(el).addClass('active');

    // 하위 카테고리 탭 갱신 및 첫 번째 설문 로드
    updateCategoryTabs(targetKey);
}

// 하위 카테고리 탭 생성 (우울증 / ADHD 등)
function updateCategoryTabs(targetKey) {
    const $tabs = $('#category-tabs').empty();
    const masterData = targetDataMap[targetKey];

    masterData.forEach((item, idx) => {
        const isActive = idx === 0 ? 'active' : '';
        $tabs.append(`
            <li class="${isActive}" onclick="loadSurvey(${idx}, this)">
                <a href="javascript:;">${item.category}</a>
            </li>
        `);
    });

    // 해당 타겟의 첫 번째 설문 내용을 화면에 로드
    loadSurvey(0);
}

// 질문지 테이블 렌더링
function loadSurvey(idx, el) {
    if(el) {
        $('#category-tabs li').removeClass('active');
        $(el).addClass('active');
    }

    const masterData = targetDataMap[currentTargetKey];
    const labels = ["전혀 아님", "가끔 그럼", "자주 그럼", "항상 그럼"]; // 라벨 정의
    currentSurvey = masterData[idx];

    $('#target-label').text(currentSurvey.target);
    $('#cat-description').text(`${currentSurvey.category} 진단 항목입니다. 각 문항을 읽고 체크해 주세요.`);
    $('#result-area').hide();
    
    const $tbody = $('#survey-tbody').empty();
    currentSurvey.questions.forEach((q, qIdx) => {
        const row = `
            <tr>
                <td><span class="num">${String(qIdx+1).padStart(2, '0')}</span> ${q}</td>
                <td data-label="${labels[0]}"><input type="radio" name="q_${qIdx}" value="0"></td>
                <td data-label="${labels[1]}"><input type="radio" name="q_${qIdx}" value="1"></td>
                <td data-label="${labels[2]}"><input type="radio" name="q_${qIdx}" value="2"></td>
                <td data-label="${labels[3]}"><input type="radio" name="q_${qIdx}" value="3"></td>            
            </tr>
        `;
        $tbody.append(row);
    });
}

// 결과값 저장   
     function saveToStorage(idx, target, category, question, answer) {
        const key = `selfcheck_answers_${idx}_${target}_${category}_${question}`;
        console.log(`Saving to storage: ${key} = ${answer}`);
        const prev =   "";
        sessionStorage.setItem(key, answer);
    }

    function resetStorage() {
        for(let i =0; i<sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            if(key.startsWith("selfcheck_answers_")) {
                sessionStorage.clear(key);
            }
        }
    }

// 결과 계산
function calculateResult() {
    let score = 0;
    let complete = true;
    
    resetStorage();
    
    currentSurvey.questions.forEach((_, idx) => {
        const val = $(`input[name="q_${idx}"]:checked`).val();
        if(val === undefined) complete = false;
        else {
            score += parseInt(val);
            console.log(currentSurvey.questions[idx], "선택값:", val, "누적 점수:", score);
            console.log(currentSurvey.category);
            console.log(currentSurvey.target);

            saveToStorage( idx, currentSurvey.target, currentSurvey.category, currentSurvey.questions[idx], parseInt(val));
         }
    });

    if(!complete) {
        alert("모든 문항에 체크해 주세요.");
        return;
    }

    let resultTxt = "결과 데이터가 없습니다.";
    currentSurvey.results.forEach(res => {
        if(score >= res.min && score <= res.max) resultTxt = res.text;
    });



    $('#my_score').text(score);
    $('#my_res').html(resultTxt);
    $('#result-area').fadeIn();
    
    // 결과 확인 후 하단으로 스크롤
    $('html, body').animate({ scrollTop: $('#result-area').offset().top - 100 }, 500);
}

function resetSurvey() {
    $('input[type="radio"]').prop('checked', false);
    $('#result-area').hide();
    window.scrollTo(0, 0);
}

function exportPDF() {
    let surveyResults = []; 
    let target = "";
    let category = "";    

    for(let i = 0; i < sessionStorage.length; i++) {
        const key = sessionStorage.key(i);
        if(key.startsWith("selfcheck_answers_")) {
                const data = sessionStorage.getItem(key);

                const match = key.match(/"selfcheck_answers_(\d+)_(\d+)_(\d+)_(\d+)"/);
                if (match) {
                    const idx = parseInt(match[1]);
                    target = parseInt(match[2]);
                    category = parseInt(match[3]);
                    const question = parseInt(match[4]);

                    surveyResults.push({ idx, question, answer: data });
                }            
        }
    }

    surveyResults.sort((a, b) => a.idx - b.idx || a.question - b.question);
    let selfChckContent = `
            <div style="padding: 30px; font-family: 'Noto Sans KR', sans-serif; line-height: 1.6;">
                <div style="border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
                    <h1 style="margin: 0; color: #1a1a1a;">자가진단 결과 보고서</h1>
                    <p style="margin: 5px 0 0 0; color: #666;">마음 , 인지행동심리상담센터</p>
                </div>
                
                <p style="text-align: right; font-size: 0.9em;">발행일시: ${new Date().toLocaleString()}</p>
                <p style="text-align: right; font-size: 0.9em;">자가진단 유형: ${target + ' : ' + category}</p>

                <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <tr style="background-color: #f8f9fa;">
                        <th style="border: 1px solid #dee2e6; padding: 12px; width: 80%;">질문</th>
                        <th style="border: 1px solid #dee2e6; padding: 12px; width: 20%;">선택답변</th>
                    </tr>
    `; 
    surveyResults.forEach(res => {
        const questionText = currentSurvey.questions[res.question];
        const answerText = ["전혀 아님", "가끔 그럼", "자주 그럼", "항상 그럼"][res.answer] || "알 수 없음";
        selfChckContent += `
            <tr>
                <td style="border: 1px solid #dee2e6; padding: 12px;">${questionText}</td>
                <td style="border: 1px solid #dee2e6; padding: 12px; text-align: center;">${answerText}</td>
            </tr>
        `;
    });

    selfChckContent += 
        ` </table>
        
            <div style="margin-top: 30px; padding: 20px; background-color: #e9ecef; border-radius: 8px;">
                <h2 style="margin-top: 0; color: #1a1a1a;">총점: ${$('#my_score').text()}점</h2>
                <p style="margin: 10px 0 0 0; color: #495057;">${$('#my_res').html()}</p>
            </div> 
            <div style="margin-top: 40px; padding: 20px; background-color: #f1f3f5; border-radius: 8px;">
                <p style="margin: 0; font-size: 0.9em; color: #495057;">
                    * 본 진단 결과는 참고용이며, 정확한 진단은 전문가와의 상담을 통해 확인하시기 바랍니다.
                </p>
            </div>
        </div>
    `;

    const worker = html2pdf(); 
            const opt = {
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                margin: 15,
                filename: `SelfCheck_Report_${new Date().getTime()}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };        
        worker.from(selfChckContent).set(opt).save();

    alert("PDF 다운로드가 시작됩니다. 잠시만 기다려 주세요.");
}


</script>
</html>
