<!DOCTYPE html>
<html lang="ko">
<head>
 <header basic-components="components/header.html">
</header>

<body>

<section id="therapist" style="flex:1;">
  <div class="therapist-content">
    <p class="therapist-eyebrow">Expertise</p>
    <h1 class="therapist-h1" id="e-hero-h-expert">
      내담자의 이야기에<br><em>귀 기울입니다</em>
    </h1>
    <p class="therapist-body" id="e-hero-b">
      김지혜 소장은 1급 정신건강전문요원, 정신건강간호사, 인지행동치료사, 1급 심리상담사, 보건·보육 전문가로서 다양한 자격과 풍부한 현장 경험을 바탕으로 내담자 한 분 한 분의 고유한 이야기에 귀 기울이며 맞춤형 상담을 제공하고 있습니다.
    </p>

    <h3 style="font-family: var(--f-display); font-size: 20px; font-weight: 700; margin-bottom:16px;" id="e-cred-h">김지혜 소장 주요 <em>자격 및 경력</em></h3>
    <div class="cred-list">
      <span class="cred-badge" id="e-c1">1급 정신건강전문요원</span>
      <span class="cred-badge" id="e-c2">정신건강간호사</span>
      <span class="cred-badge" id="e-c3">인지행동치료사</span>
      <span class="cred-badge" id="e-c4">1급 심리상담사</span>
      <span class="cred-badge" id="e-c5">보건·보육 전문가</span>
    </div>
  </div>

  <div class="therapist-photo drop-zone" id="drop-hero-exp" data-key="img-hero-exp">
    <img id="img-hero-exp" src="assets/logo.png" alt="전문가 프로필">
  </div>
</section>

<div basic-components="components/footer.html"></div>

<div id="toast"></div>
<script type="module" src="main.js" defer></script>
<script  src="components/components.js" defer></script>

</body>
