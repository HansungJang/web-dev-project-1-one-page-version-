<!DOCTYPE html>
<html lang="ko">
<head>
 <header basic-components="components/header.html">
</header>

<body>

<section id="fields" style="flex:1;">
  <div class="wrap">
    <p class="sec-tag sr">Counseling Fields</p>
    <h2 class="sec-h sr" id="e-fields-h">우리는 이런 <em>변화</em>를 만듭니다</h2>
    
    <div class="fields-grid">
      <div class="field-card sr">
        <h4 id="e-f1-h">정신병리 및 정서관리</h4>
        <p id="e-f1-b">우울, 불안, 공황 등 신경증부터 조현병, 조울병 등 전문적인 심리 개입이 필요한 문제를 다룹니다.</p>
      </div>
      <div class="field-card sr d1">
        <h4 id="e-f2-h">자기조절 및 스트레스</h4>
        <p id="e-f2-b">분노 조절, 스트레스 관리 및 인지행동치료(CBT) 기반의 인지 재구조화 훈련을 제공합니다.</p>
      </div>
      <div class="field-card sr d2">
        <h4 id="e-f3-h">관계와 가족</h4>
        <p id="e-f3-b">대인관계 갈등, 가족 문제, 부부상담 및 효율적인 양육방법 코칭을 통해 관계의 회복을 돕습니다.</p>
      </div>
      <div class="field-card sr">
        <h4 id="e-f4-h">아동·청소년 및 성인</h4>
        <p id="e-f4-b">전 생애주기에 걸친 심리상담과 사회기술훈련(SST)을 통해 사회적 적응을 지원합니다.</p>
      </div>
    </div>
  </div>
</section>

 <div basic-components="components/footer.html"></div>

<div id="toast"></div>
<script type="module" src="main.js" defer></script>
<script  src="components/components.js" defer></script>

</body>
</html>
